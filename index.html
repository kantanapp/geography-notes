<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geography Notes 1.1–1.3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="app-title">Geography Notes</h1>
      <nav class="tabs" id="tabs" aria-label="Unit"></nav>
      <a class="score" id="score" href="#kiroku" aria-live="polite" title="Jump to your progress"></a>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </header>

  <main id="main">
    <div class="sheet" id="sheet"></div>
    <section class="kiroku" id="kiroku" aria-labelledby="k-title"></section>
  </main>

  <footer class="actions">
    <div class="actions-row">
      <button type="button" id="btn-check" class="btn primary">Check answers</button>
      <button type="button" id="btn-reveal" class="btn">Show answers</button>
      <button type="button" id="btn-reset" class="btn ghost">Clear</button>
    </div>
  </footer>

  <dialog class="result" id="result">
    <div class="result-inner">
      <div class="result-head">
        <h2 id="result-title">Results</h2>
        <div class="result-head-btns">
          <button type="button" class="btn small" id="btn-to-kiroku">★ Progress</button>
          <button type="button" class="btn ghost small" id="btn-close">Close</button>
        </div>
      </div>
      <div id="result-body"></div>
    </div>
  </dialog>

  <script src="data/units.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
