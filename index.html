<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geography Notes 1.1–1.3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="app-title">Geography Notes</h1>
      <nav class="tabs" id="tabs" aria-label="Unit"></nav>
      <button type="button" class="score" id="score" aria-live="polite" title="きろくページを見る"></button>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  </header>

  <main class="sheet" id="sheet"></main>
  <section class="kiroku" id="kiroku" hidden aria-label="きろく"></section>

  <footer class="actions">
    <div class="actions-row" id="actions-quiz">
      <button type="button" id="btn-check" class="btn primary">答え合わせ</button>
      <button type="button" id="btn-reveal" class="btn">答えを見る</button>
      <button type="button" id="btn-reset" class="btn ghost">リセット</button>
    </div>
    <div class="actions-row" id="actions-kiroku" hidden>
      <button type="button" id="btn-back" class="btn primary">もんだいにもどる</button>
    </div>
  </footer>

  <dialog class="result" id="result">
    <div class="result-inner">
      <div class="result-head">
        <h2 id="result-title">結果</h2>
        <div class="result-head-btns">
          <button type="button" class="btn small" id="btn-to-kiroku">★ きろく</button>
          <button type="button" class="btn ghost small" id="btn-close">閉じる</button>
        </div>
      </div>
      <div id="result-body"></div>
    </div>
  </dialog>

  <script src="data/units.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
